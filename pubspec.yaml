name: biashara_bridge
description: Biashara Bridge - Empowering Kenyan SMEs with digital identity, payments, and analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Firebase (latest compatible with Flutter 3.35+)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  google_sign_in: ^7.2.0
  # State management
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1
  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  # Maps (flutter_map, pure Dart, no JS interop, free tiles)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Utilities
  intl: ^0.18.1
  uuid: ^4.0.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.2.3
  mockito: ^5.4.2
  mocktail: ^0.3.0

flutter:
  uses-material-design: true
